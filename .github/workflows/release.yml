name: AEGIS Binary Release Pipeline

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-x86:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AEGIS
        uses: actions/checkout@v4
        with:
          path: aegis-runtime

      - name: Checkout AIEN Sovereign Core Dependencies
        uses: actions/checkout@v4
        with:
          repository: aien-dev/aien-sovereign-core
          path: aien-sovereign-core

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Binary
        working-directory: aegis-runtime
        run: cargo build --release

      - name: Package Binary
        working-directory: aegis-runtime
        run: |
          mkdir -p dist
          cp target/release/aegis dist/aegis
          chmod +x dist/aegis
          tar -czf aegis-linux-x86_64.tar.gz -C dist aegis
          sha256sum aegis-linux-x86_64.tar.gz > aegis-linux-x86_64.tar.gz.sha256

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aegis-linux-x86_64
          path: aegis-runtime/aegis-linux-x86_64.*

  publish-release:
    name: Publish Release and Checksums
    needs: build-linux-x86
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate Checksums
        working-directory: release-artifacts
        run: |
          sha256sum aegis-linux-*.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="v0.1.0"
          fi
          cd release-artifacts
          gh release create "$TAG" aegis-linux-*.tar.gz aegis-linux-*.sha256 SHA256SUMS.txt \
            --title "AEGIS $TAG" \
            --notes "Official binary release of AEGIS native sovereign runtime." \
            --draft=false \
            --prerelease=false || \
          gh release upload "$TAG" aegis-linux-*.tar.gz aegis-linux-*.sha256 SHA256SUMS.txt --clobber
