name: OpenClaw Binary Release Pipeline

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            arch: aarch64
          - os: ubuntu-latest
            arch: x86_64

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Binary
        run: cargo build --release

      - name: Package Binary
        run: |
          mkdir -p dist
          cp target/release/openclaw dist/openclaw
          chmod +x dist/openclaw
          tar -czf openclaw-linux-${{ matrix.arch }}.tar.gz -C dist openclaw
          sha256sum openclaw-linux-${{ matrix.arch }}.tar.gz > openclaw-linux-${{ matrix.arch }}.tar.gz.sha256

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-linux-${{ matrix.arch }}
          path: |
            openclaw-linux-${{ matrix.arch }}.tar.gz
            openclaw-linux-${{ matrix.arch }}.tar.gz.sha256

  publish-release:
    name: Publish Release and Aggregated Checksums
    needs: build-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, refs/tags/v) || github.event_name == workflow_dispatch
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate Aggregated Checksums
        working-directory: release-artifacts
        run: |
          sha256sum openclaw-linux-*.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-v0.1.0}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -z "${GITHUB_REF_NAME}" ]; then
            TAG_NAME="v0.1.0"
          fi

          NOTES_FILE="RELEASE_NOTES.md"
          if [ ! -f "$NOTES_FILE" ]; then
            echo "# OpenClaw ${TAG_NAME}" > "$NOTES_FILE"
            echo "" >> "$NOTES_FILE"
            echo "Official release of OpenClaw native sovereign runtime." >> "$NOTES_FILE"
          fi

          cd release-artifacts
          gh release create "$TAG_NAME" openclaw-linux-*.tar.gz SHA256SUMS.txt \
            --title "OpenClaw ${TAG_NAME}" \
            --notes-file ../"$NOTES_FILE" \
            --draft=false \
            --prerelease=false || \
          gh release upload "$TAG_NAME" openclaw-linux-*.tar.gz SHA256SUMS.txt --clobber
